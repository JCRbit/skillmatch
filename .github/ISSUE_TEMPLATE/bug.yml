name: Bug / defect
about: Report a reproducible issue
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce with synthetic/non-sensitive data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs/screenshots with secrets and PII redacted
  - type: textarea
    id: environment
    attributes:
      label: Commit, browser, OS, package version
