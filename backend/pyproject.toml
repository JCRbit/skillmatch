[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skillmatch"
version = "0.1.0"
description = "SkillMatch backend: competency-based matching between junior talent and companies."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies only. Libraries are added by the task that needs them
# (e.g. SQLAlchemy/Alembic/psycopg arrive with B-01) using `uv add <package>`.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skillmatch"]

# --------------------------------------------------------------------------- #
# Ruff: linting and formatting
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "D",        # pydocstyle (Google convention, see below)
    "UP",       # pyupgrade
    "ANN",      # type annotations
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "DTZ",      # naive datetimes
    "T20",      # print statements
    "SIM",      # simplifications
    "PT",       # pytest style
    "RET",      # return statements
    "ARG",      # unused arguments
    "S",        # security (bandit)
    "TID",      # tidy imports
    "PERF",     # performance anti-patterns
    "FAST",     # FastAPI-specific checks
    "RUF",      # ruff-specific rules
]
ignore = [
    "D107",     # __init__ is documented in the class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only: module boundaries are enforced by tests/architecture.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",        # tests are documented by their names
    "S101",     # assert is the idiom in pytest
]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- #
# mypy: strict typing from day one
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = ["src", "."]
explicit_package_bases = true
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- #
# pytest and coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["skillmatch"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
